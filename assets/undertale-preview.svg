  </defs>
  <rect width="800" height="450" fill="url(#bg_ut)"/>
  <rect x="40" y="30" width="720" height="390" rx="16" fill="#0d0718" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2"/>
  
