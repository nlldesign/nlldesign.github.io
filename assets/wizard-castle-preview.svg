      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#gridPat)"/>
  
  <circle cx="400" cy="225" r="210" fill="rgba(168,85,247,0.15)"/>
