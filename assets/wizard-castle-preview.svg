  <rect x="220" y="134" width="360" height="144" fill="#110d1c" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="400" cy="206" r="28" fill="rgba(34,211,238,0.2)" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="400" cy="206" r="6" fill="#f59e0b"/>
