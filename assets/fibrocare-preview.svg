<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06181b"/>
      <stop offset="100%" stop-color="#0a2a22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="40" y="30" width="720" height="390" rx="16" fill="#0d1b1e" stroke="#10b981" stroke-opacity="0.25" stroke-width="2"/>
  
  <!-- Header bar -->
  <rect x="40" y="30" width="720" height="50" rx="16" fill="#091416"/>
  <circle cx="70" cy="55" r="6" fill="#ef4444"/>
  <circle cx="90" cy="55" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="55" r="6" fill="#10b981"/>
  <text x="140" y="60" fill="#94a3b8" font-family="monospace" font-size="14">FibroCare // Monitor Cíclico &amp; Mapa Anatômico ACR</text>
  <rect x="620" y="45" width="115" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
  <text x="635" y="60" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">ONLINE • SUPABASE</text>

  <!-- Left: Body Map Silhouette Wireframe -->
  <rect x="70" y="105" width="280" height="285" rx="12" fill="#071214" stroke="#10b981" stroke-opacity="0.15"/>
  <text x="90" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">Mapa Corporal (18 Pontos ACR)</text>
  
  <!-- Stylized Figure -->
  <circle cx="210" cy="175" r="18" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="210" y1="193" x2="210" y2="280" stroke="#06b6d4" stroke-width="3"/>
  <line x1="210" y1="215" x2="160" y2="260" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="210" y1="215" x2="260" y2="260" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="210" y1="280" x2="175" y2="350" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="210" y1="280" x2="245" y2="350" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Pain hotspots glowing -->
  <circle cx="185" cy="210" r="7" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)"/>
  <circle cx="235" cy="210" r="7" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)"/>
  <circle cx="210" cy="245" r="6" fill="#fbbf24"/>
  <circle cx="180" cy="305" r="6" fill="#fbbf24"/>
  <circle cx="240" cy="305" r="6" fill="#fbbf24"/>

  <!-- Right: Metrics and Crisis Predictor -->
  <rect x="375" y="105" width="355" height="135" rx="12" fill="#071214" stroke="#10b981" stroke-opacity="0.15"/>
  <text x="395" y="135" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">Predição de Crise em 24h–48h</text>
  <rect x="395" y="150" width="315" height="12" rx="6" fill="#1e293b"/>
  <rect x="395" y="150" width="220" height="12" rx="6" fill="url(#glow)"/>
  <text x="395" y="185" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold">ALERTA MODERADO (68%)</text>
  <text x="395" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Fatores climáticos e ciclo de sono correlacionados</text>

  <!-- Right Bottom: Historical Graph -->
  <rect x="375" y="255" width="355" height="135" rx="12" fill="#071214" stroke="#10b981" stroke-opacity="0.15"/>
  <text x="395" y="285" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold">Índice WPI / Sintomas SSS</text>
  <path d="M 400 360 Q 440 310, 480 340 T 560 300 T 640 350 T 710 290" fill="none" stroke="#10b981" stroke-width="3"/>
  <circle cx="710" cy="290" r="5" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>
</svg>