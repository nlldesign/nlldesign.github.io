  <rect x="415" y="165" width="315" height="210" rx="12" fill="#160e33" stroke="#8b5cf6" stroke-opacity="0.2"/>
  <text x="440" y="198" fill="#e2e8f0" font-family="sans-serif" font-size="15" font-weight="bold">Loja de Recompensas Reais</text>
  
  <rect x="440" y="220" width="265" height="42" rx="8" fill="#24174f"/>
