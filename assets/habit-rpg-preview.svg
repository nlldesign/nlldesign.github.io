  <text x="640" y="301" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold">450 GP</text>

  <text x="440" y="355" fill="#94a3b8" font-family="monospace" font-size="11">Integração com Supabase &amp; Schemas SQL</text>
