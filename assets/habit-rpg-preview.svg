    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg_habit)"/>
  <rect x="40" y="30" width="720" height="390" rx="16" fill="#100b24" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Character Banner Card -->
  <rect x="70" y="60" width="660" height="85" rx="12" fill="#1b123d" stroke="#8b5cf6" stroke-opacity="0.2"/>
