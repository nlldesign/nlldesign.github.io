  <text x="105" y="275" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="135" y="265" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">2h Foco em Código 3D</text>
  <text x="135" y="283" fill="#a78bfa" font-family="monospace" font-size="11">+25 XP • +12 Ouro</text>

  <rect x="70" y="315" width="315" height="60" rx="10" fill="#160e33" stroke="#8b5cf6" stroke-opacity="0.2"/>
  <circle cx="105" cy="345" r="14" fill="#64748b" fill-opacity="0.2"/>
  <text x="135" y="340" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Revisão Financeira Semanal</text>
  <text x="135" y="358" fill="#a78bfa" font-family="monospace" font-size="11">Pendente • +10 XP</text>

