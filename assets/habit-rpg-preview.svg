  <text x="105" y="200" text-anchor="middle" fill="#34d399" font-size="14">✓</text>
  <text x="135" y="190" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Treino de Hipertrofia</text>
  <text x="135" y="208" fill="#a78bfa" font-family="monospace" font-size="11">+15 XP • +5 Ouro</text>

  <rect x="70" y="240" width="315" height="60" rx="10" fill="#160e33" stroke="#8b5cf6" stroke-opacity="0.2"/>
